<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Godot Iframe Test Parent</title>
  <style>
    body { background: #222; color: #fff; font-family: system-ui, sans-serif; }
    iframe { border: 2px solid #09f; display:block; }
    .toolbar { margin: 12px 0; display:flex; gap:8px; align-items:center; flex-wrap: wrap; }
    .btn { padding: 8px 12px; background:#0af; color:#002; border:none; border-radius:6px; cursor:pointer; }
    .btn:active { transform: translateY(1px); }
    .pill { background:#111; border:1px solid #444; padding:4px 8px; border-radius:999px; }
    .log { font-size: 12px; color:#9ad; margin-top:8px; white-space:pre-wrap; }
  </style>
</head>
<body>
  <h2>Mockup Parent - Godot Iframe Integration</h2>

  <!-- เพิ่ม autoplay เผื่อช่วยเสียง -->
  <iframe id="gameframe" src="game/index.html" width="900" height="600" allow="autoplay"></iframe>

  <div class="toolbar">
    <button class="btn" onclick="addMana(100)">+100 Mana</button>
    <button class="btn" onclick="clearMana()">Clear Mana = 0</button>
    <button class="btn" onclick="pushToGame()">Push → Game</button>
    <button class="btn" onclick="pullFromGame()">Pull ← Game</button>
    <button class="btn" onclick="testRequestMana(25)">Simulate requestMana 25</button>
    <span class="pill">Parent Mana: <span id="manaLabel">0</span></span>
    <span class="pill">Last Game Mana: <span id="gameManaLabel">?</span></span>
    <span class="pill">Origin: <strong id="originMode">DEV</strong></span>
  </div>

  <div class="log" id="log"></div>

<script>
  // =========================
  // Config
  // =========================
  // DEV = false (ยอมรับทุก origin), PROD = true (บังคับ origin ตรงกันเท่านั้น)
  const STRICT_ORIGIN_CHECK = false;

  // API ตั้งไว้ที่นี่ (ระวัง mixed content ถ้าเพจเป็น https)
  const API_BASE = 'http://localhost:3000';

  // =========================
  // State
  // =========================
  let mana = 0;
  const address = '0x0000000000000000000000000000000000000193';

  const manaLabel = document.getElementById('manaLabel');
  const gameManaLabel = document.getElementById('gameManaLabel');
  const iframe = document.getElementById('gameframe');
  const originModeEl = document.getElementById('originMode');

  // origin ของเกม (ถ้า src เป็น relative จะเท่ากับ origin เดียวกับหน้า parent)
  const GAME_ORIGIN = new URL(iframe.getAttribute('src'), location.href).origin;
  originModeEl.textContent = STRICT_ORIGIN_CHECK ? 'PROD' : 'DEV';

  const updateParentLabel = () => (manaLabel.textContent = String(mana));

  const log = (msg) => {
    const el = document.getElementById('log');
    const line = `[${new Date().toLocaleTimeString()}] ${msg}`;
    console.log(line);
    el.textContent = line + '\n' + el.textContent;
  };

  // =========================
  // Helper
  // =========================
  const targetOrigin = () => (STRICT_ORIGIN_CHECK ? GAME_ORIGIN : '*');

  function postToGame(payload) {
    try {
      iframe.contentWindow.postMessage(payload, targetOrigin());
      log(`[SEND] to Game: ${JSON.stringify(payload)}`);
    } catch (e) {
      console.error('postToGame error:', e);
      log(`[SEND][ERROR] ${e}`);
    }
  }

  async function fetchMana() {
    try {
      const res = await fetch(`${API_BASE}/api/getMana/${address}`);
      const data = await res.json();
      mana = Number(data?.mana) || 0;
      updateParentLabel();
      log(`[API] getMana → ${mana}`);
    } catch (err) {
      console.error('Error fetching mana:', err);
      log('[API][ERROR] getMana failed');
    }
  }

  // =========================
  // Buttons
  // =========================
  async function addMana(amount) {
    try {
      const res = await fetch(`${API_BASE}/api/addMana`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ address, amount })
      });
      const data = await res.json();
      if (data.success) {
        mana = Number(data.updatedMana) || 0;
        updateParentLabel();
        log(`[API] addMana +${amount} → ${mana}`);
      } else {
        log(`[API][ERROR] addMana: ${data.error || 'unknown'}`);
      }
    } catch (err) {
      console.error('addMana error:', err);
      log('[API][ERROR] addMana failed');
    }
  }

  function clearMana() {
    mana = 0;
    updateParentLabel();
    log(`Parent cleared mana → ${mana}`);
  }

  function pushToGame() {
    postToGame({ type: 'updateMana', mana });
  }

  function pullFromGame() {
    postToGame({ type: 'getMana' });
  }

  // ✅ แก้ simulate ให้ reply กลับเข้ากรอบเกมได้จริง
  function testRequestMana(amount = 25) {
    const fakeEvent = new MessageEvent('message', {
      data: { type: 'requestMana', amount },
      origin: GAME_ORIGIN,
      // สำคัญ: source = iframe.contentWindow เพื่อให้ event.source.postMessage() ส่งกลับเข้าเกมได้
      source: iframe.contentWindow
    });
    window.dispatchEvent(fakeEvent);
    log(`[TEST] simulate requestMana ${amount}`);
  }

  // =========================
  // Iframe loaded → sync แรก
  // =========================
  iframe.addEventListener('load', () => {
    log('[Parent] iframe loaded → request getMana');
    postToGame({ type: 'getMana' });
  });

  // ดึง mana จาก API ตอนเปิดหน้า
  fetchMana();

  // =========================
  // รับข้อความจากเกม
  // =========================
  window.addEventListener('message', async (event) => {
    console.log('[Parent] raw event:', event);

    if (STRICT_ORIGIN_CHECK && event.origin !== GAME_ORIGIN) {
      log(`[DROP] origin mismatch from ${event.origin}`);
      return;
    }

    const data = event.data;
    if (!data || typeof data !== 'object') {
      log('[DROP] message without object payload');
      return;
    }
    if (!data.type) {
      log('[DROP] message without "type"');
      return;
    }

    log(`[RECV] from Game: ${JSON.stringify(data)}`);

    switch (data.type) {
      // เกมขอหักพลังเพื่อเล่น
      case 'requestMana': {
        const amount = Number(data.amount) || 0;
        log(`[RECV] requestMana amount=${amount}`);

        try {
          const res = await fetch(`${API_BASE}/api/requestMana`, {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ address, amount })
          });
          const result = await res.json(); // { success, updatedMana }
          if (result.success) mana = Number(result.updatedMana) || 0;
          updateParentLabel();

          event.source.postMessage(
            { type: 'manaUpdated', approved: !!result.success, mana },
            STRICT_ORIGIN_CHECK ? event.origin : '*'
          );
          log(`[SEND] to Game: manaUpdated approved=${!!result.success} mana=${mana}`);
        } catch (err) {
          console.error('requestMana API error:', err);
          event.source.postMessage(
            { type: 'manaUpdated', approved: false, mana },
            STRICT_ORIGIN_CHECK ? event.origin : '*'
          );
          log('[SEND] to Game: manaUpdated approved=false');
        }
        break;
      }

      // เกมชนะ → ขอเครดิตพลังคืน (ถ้ามี endpoint ใช้ที่นี่; ถ้าไม่มี จะบวก local แล้วส่งกลับ)
      case 'creditMana': {
        const amount = Number(data.amount) || 0;
        try {
          // ถ้ามี API จริง ปลดคอมเมนต์สามบรรทัดล่างนี้
          // const res = await fetch(`${API_BASE}/api/creditMana`, {
          //   method: 'POST', headers: { 'Content-Type': 'application/json' },
          //   body: JSON.stringify({ address, amount })
          // });
          // const result = await res.json(), serverMana = Number(result?.updatedMana);

          // mock (หรือ fallback): บวก local
          mana += amount;

          updateParentLabel();
          event.source.postMessage(
            { type: 'updateMana', mana },
            STRICT_ORIGIN_CHECK ? event.origin : '*'
          );
          log(`[SEND] to Game: updateMana=${mana} (credit ${amount})`);
        } catch (err) {
          console.error('creditMana API error:', err);
          // ในกรณี error คุณอาจแจ้งกลับเกมด้วยก็ได้ (หรือเงียบ)
        }
        break;
      }

      // เกมขอ pull ค่าจาก parent
      case 'getMana': {
        event.source.postMessage(
          { type: 'updateMana', mana },
          STRICT_ORIGIN_CHECK ? event.origin : '*'
        );
        log(`[SEND] to Game: updateMana=${mana} (respond to getMana)`);
        break;
      }

      // เกม push ค่า mana ของมันมา (แค่โชว์ใน UI parent)
      case 'updateMana': {
        gameManaLabel.textContent = String(data.mana);
        log(`[UI] Last Game Mana updated to: ${data.mana}`);
        break;
      }

      default:
        log(`[INFO] Unhandled type: ${data.type}`);
    }
  });
</script>
</body>
</html>
