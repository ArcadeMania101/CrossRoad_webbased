<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Godot Iframe Test Parent</title>
  <style>
    body { background: #222; color: #fff; font-family: system-ui, sans-serif; }
    iframe { border: 2px solid #09f; display:block; }
    .toolbar { margin: 12px 0; display:flex; gap:8px; align-items:center; flex-wrap: wrap; }
    .btn { padding: 8px 12px; background:#0af; color:#002; border:none; border-radius:6px; cursor:pointer; }
    .btn:active { transform: translateY(1px); }
    .pill { background:#111; border:1px solid #444; padding:4px 8px; border-radius:999px; }
    .log { font-size: 12px; color:#9ad; margin-top:8px; white-space:pre-wrap; }
  </style>
</head>
<body>
  <h2>Mockup Parent - Godot Iframe Integration</h2>

  <!-- เพิ่ม allow="autoplay" เผื่อช่วยเรื่องเสียง (ขึ้นกับ browser policy) -->
  <iframe id="gameframe" src="game/index.html" width="900" height="600" allow="autoplay"></iframe>

  <div class="toolbar">
    <button class="btn" onclick="addMana(100)">+100 Mana</button>
    <button class="btn" onclick="clearMana()">Clear Mana = 0</button>
    <button class="btn" onclick="pushToGame()">Push → Game</button>
    <button class="btn" onclick="pullFromGame()">Pull ← Game</button>
    <span class="pill">Parent Mana: <span id="manaLabel">0</span></span>
    <span class="pill">Last Game Mana: <span id="gameManaLabel">?</span></span>
    <span class="pill">Origin check: <strong id="originMode">DEV</strong></span>
  </div>

  <div class="log" id="log"></div>

<script>
  // =========================
  // Config
  // =========================
  // PROD ให้ตั้งเป็น true เพื่อบังคับ origin ตรงกันเท่านั้น
  const STRICT_ORIGIN_CHECK = false; // DEV=false, PROD=true

  // =========================
  // State
  // =========================
  let mana = 1000; // กระเป๋า mock ฝั่ง parent
  const manaLabel = document.getElementById('manaLabel');
  const gameManaLabel = document.getElementById('gameManaLabel');
  const iframe = document.getElementById('gameframe');
  const originModeEl = document.getElementById('originMode');

  // origin ของเกม (ถ้า src เป็น relative จะได้ origin เดียวกับ parent)
  const GAME_ORIGIN = new URL(iframe.getAttribute('src'), location.href).origin;

  originModeEl.textContent = STRICT_ORIGIN_CHECK ? 'PROD' : 'DEV';

  const updateParentLabel = () => (manaLabel.textContent = String(mana));
  updateParentLabel();

  const log = (msg) => {
    const el = document.getElementById('log');
    const line = `[${new Date().toLocaleTimeString()}] ${msg}`;
    console.log(line);
    el.textContent = line + '\n' + el.textContent;
  };

  // =========================
  // Helper: ส่งข้อความเข้าเกม
  // =========================
  function targetOrigin() {
    return STRICT_ORIGIN_CHECK ? GAME_ORIGIN : '*';
  }

  function postToGame(payload) {
    try {
      iframe.contentWindow.postMessage(payload, targetOrigin());
      log(`[SEND] to Game: ${JSON.stringify(payload)}`);
    } catch (e) {
      console.error('postToGame error:', e);
      log(`[SEND][ERROR] ${e}`);
    }
  }

  // =========================
  // Buttons
  // =========================
  function addMana(amount) {
    mana += amount;
    updateParentLabel();
    log(`Parent +${amount} mana → ${mana}`);
  }

  function clearMana() {
    mana = 0;
    updateParentLabel();
    log(`Parent cleared mana → ${mana}`);
  }

  function pushToGame() {
    postToGame({ type: 'updateMana', mana });
  }

  function pullFromGame() {
    postToGame({ type: 'getMana' });
  }

  // =========================
  // Iframe loaded → ขอ sync รอบแรก
  // =========================
  iframe.addEventListener('load', () => {
    log('[Parent] iframe loaded → request getMana');
    postToGame({ type: 'getMana' });
  });

  // =========================
  // รับข้อความจากเกม
  // =========================
  window.addEventListener('message', (event) => {
    // Debug raw event
    console.log('[Parent] raw event:', event);

    // ความปลอดภัย: PROD ให้เช็ค origin
    if (STRICT_ORIGIN_CHECK && event.origin !== GAME_ORIGIN) {
      log(`[DROP] origin mismatch from ${event.origin}`);
      return;
    }

    const data = event.data;
    if (!data || typeof data !== 'object') {
      log('[DROP] message without object payload');
      return;
    }
    if (!data.type) {
      log('[DROP] message without "type"');
      return;
    }

    log(`[RECV] from Game: ${JSON.stringify(data)}`);

    switch (data.type) {
      // เกมขอหักพลังเพื่อเล่น
      case 'requestMana': {
        const amount = Number(data.amount) || 0;
        const approved = mana >= amount;
        if (approved) mana -= amount;
        updateParentLabel();

        event.source.postMessage(
          { type: 'manaUpdated', approved, mana },
          STRICT_ORIGIN_CHECK ? event.origin : '*'
        );
        log(`[SEND] to Game: manaUpdated approved=${approved} mana=${mana}`);
        break;
      }

      // เกมชนะ → ขอเครดิตพลังคืนเข้ากระเป๋า parent
      case 'creditMana': {
        const amount = Number(data.amount) || 0;
        mana += amount;
        updateParentLabel();

        // ส่งยอดล่าสุดกลับให้เกม sync UI
        event.source.postMessage(
          { type: 'updateMana', mana },
          STRICT_ORIGIN_CHECK ? event.origin : '*'
        );
        log(`[SEND] to Game: updateMana=${mana} (credit ${amount})`);
        break;
      }

      // เกมขอดึงยอดจาก parent
      case 'getMana': {
        event.source.postMessage(
          { type: 'updateMana', mana },
          STRICT_ORIGIN_CHECK ? event.origin : '*'
        );
        log(`[SEND] to Game: updateMana=${mana} (respond to getMana)`);
        break;
      }

      // เกม push ค่า mana ของมันกลับมา (ถ้าเกมเลือกทำ — สำหรับโชว์ใน UI parent)
      case 'updateMana': {
        gameManaLabel.textContent = String(data.mana);
        log(`[UI] Last Game Mana updated to: ${data.mana}`);
        break;
      }

      default:
        log(`[INFO] Unhandled type: ${data.type}`);
    }
  });
</script>
</body>
</html>
